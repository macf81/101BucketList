<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbumes • Mario</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --blue:#3b82f6; --green:#22c55e; --orange:#f97316; --red:#ef4444; --purple:#a855f7;
      --green-bg:#f0fdf4; --orange-bg:#fff7ed; --blue-bg:#eff6ff; --red-bg:#fef2f2;
      --text:#111827; --text2:#6b7280; --border:#e5e7eb;
      --card:#ffffff; --bg:#f9fafb;
      --gradient:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
      --shadow-sm:0 1px 3px rgba(0,0,0,.08); --shadow:0 4px 16px rgba(0,0,0,.10);
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }

    .site-nav { background:var(--card); border-bottom:1px solid var(--border); display:flex; justify-content:center; overflow-x:auto; scrollbar-width:none; position:sticky; top:0; z-index:200; box-shadow:var(--shadow-sm); }
    .site-nav::-webkit-scrollbar { display:none; }
    .site-nav a { padding:10px 20px; text-decoration:none; color:var(--text2); font-size:13px; font-weight:600; border-bottom:2px solid transparent; white-space:nowrap; transition:all .15s; display:flex; align-items:center; gap:6px; }
    .site-nav a:hover { color:var(--text); background:var(--bg); }
    .site-nav a.active { color:var(--blue); border-bottom-color:var(--blue); }

    .profile-header { background:var(--card); border-bottom:1px solid var(--border); }
    .profile-cover  { background:var(--gradient); height:9px; }
    .profile-inner  { max-width:980px; margin:0 auto; padding:0 20px 18px; }
    .profile-row    { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .profile-left   { display:flex; align-items:flex-end; gap:16px; }
    .avatar-wrap    { position:relative; width:72px; height:72px; border-radius:50%; border:4px solid white; margin-top:-36px; flex-shrink:0; box-shadow:var(--shadow-sm); overflow:hidden; background:var(--gradient); }
    .avatar-wrap img { width:100%; height:100%; object-fit:cover; display:none; }
    .avatar-initials { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:white; }
    .profile-name   { font-size:20px; font-weight:700; }
    .profile-bio    { color:var(--text2); font-size:13px; margin-top:2px; }
    .profile-social { display:flex; gap:12px; margin-top:6px; }
    .social-link    { display:flex; align-items:center; gap:5px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:500; padding:4px 10px; border-radius:20px; border:1px solid var(--border); transition:all .2s; }
    .social-link:hover { color:var(--blue); border-color:var(--blue); }
    .stats-wrap  { padding-top:10px; }
    .stats-row   { display:flex; gap:24px; flex-wrap:wrap; align-items:center; }
    .stat        { text-align:center; }
    .stat-num    { font-size:22px; font-weight:800; line-height:1; }
    .stat-lbl    { font-size:11px; color:var(--text2); font-weight:500; margin-top:2px; text-transform:uppercase; letter-spacing:.5px; }
    .stat.done .stat-num { color:var(--green); }
    .stat-div    { width:1px; height:36px; background:var(--border); }
    .progress-track { margin-top:10px; background:var(--border); border-radius:99px; height:6px; overflow:hidden; max-width:400px; }
    .progress-fill  { height:100%; background:var(--gradient); border-radius:99px; transition:width .6s cubic-bezier(.4,0,.2,1); }
    .progress-pct   { font-size:12px; color:var(--text2); margin-top:4px; font-weight:500; }

    .toolbar { max-width:980px; margin:0 auto; padding:14px 20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .search-box { flex:1; min-width:200px; padding:8px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--card); outline:none; }
    .search-box:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .filter-tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .ftab { padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; color:var(--text2); }
    .ftab:hover { border-color:var(--blue); color:var(--blue); }
    .ftab.active { background:var(--text); color:#fff; border-color:var(--text); }
    .genre-select { padding:7px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--card); color:var(--text); cursor:pointer; }
    .add-btn { padding:8px 16px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
    .add-btn:hover { opacity:.85; }

    .albums-grid { max-width:980px; margin:0 auto; padding:0 20px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; }
    .album-card { background:var(--card); border-radius:12px; border:1px solid var(--border); overflow:hidden; cursor:pointer; transition:all .2s; box-shadow:var(--shadow-sm); }
    .album-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
    .album-card.is-done { border-color:rgba(34,197,94,.35); }
    .album-cover { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
    .album-cover-ph { width:100%; aspect-ratio:1; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.6); font-size:36px; }
    .album-info { padding:10px 12px 12px; }
    .album-title { font-size:13px; font-weight:700; line-height:1.3; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .album-artist { font-size:12px; color:var(--text2); margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .album-footer { display:flex; align-items:center; justify-content:space-between; }
    .stars-mini { display:flex; gap:1px; }
    .star-mini { font-size:11px; color:#d1d5db; }
    .star-mini.on { color:#f59e0b; }
    .done-badge { font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:var(--green-bg); color:var(--green); }
    .pend-badge { font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:var(--orange-bg); color:var(--orange); }
    .empty { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text2); }

    /* Modal */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; align-items:flex-end; justify-content:center; }
    .overlay.open { display:flex; }
    @media(min-width:600px){ .overlay { align-items:center; padding:20px; } }
    .modal { background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; box-shadow:0 -4px 40px rgba(0,0,0,.2); }
    @media(min-width:600px){ .modal { border-radius:20px; } }
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 0; }
    .modal-num { font-size:13px; font-weight:700; color:var(--text2); background:var(--bg); padding:3px 10px; border-radius:20px; }
    .modal-close { width:32px; height:32px; border:none; background:var(--bg); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:16px; }
    .modal-tabs { display:flex; border-bottom:1px solid var(--border); margin-top:12px; }
    .mtab { flex:1; padding:10px; text-align:center; font-size:13px; font-weight:600; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; }
    .mtab.active { color:var(--blue); border-bottom-color:var(--blue); }

    /* View tab */
    .modal-cover { width:100%; aspect-ratio:1; object-fit:cover; max-height:280px; }
    .modal-cover-ph { width:100%; aspect-ratio:1; max-height:280px; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.5); font-size:80px; }
    .modal-body { padding:16px 20px 24px; }
    .modal-genre { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--blue); background:var(--blue-bg); padding:3px 8px; border-radius:10px; margin-bottom:8px; }
    .modal-title { font-size:20px; font-weight:800; line-height:1.3; margin-bottom:4px; }
    .modal-meta { font-size:14px; color:var(--text2); margin-bottom:14px; }
    .modal-desc { font-size:14px; color:var(--text2); line-height:1.6; margin-bottom:16px; font-style:italic; }
    .section-lbl { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; display:flex; align-items:center; gap:5px; margin-top:14px; }
    .listen-toggle { display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:12px 16px; }
    .toggle-label { font-size:14px; font-weight:600; }
    .toggle-wrap { position:relative; display:inline-block; width:44px; height:24px; cursor:pointer; }
    .toggle-wrap input { opacity:0; width:0; height:0; }
    .toggle-track { position:absolute; inset:0; background:#d1d5db; border-radius:12px; transition:.3s; }
    .toggle-wrap input:checked + .toggle-track { background:var(--green); }
    .toggle-track::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.3s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .toggle-wrap input:checked + .toggle-track::after { left:22px; }
    .stars-row { display:flex; gap:6px; }
    .star-btn { font-size:28px; color:#d1d5db; cursor:pointer; transition:color .1s; background:none; border:none; padding:0; line-height:1; }
    .star-btn.on { color:#f59e0b; }
    .comment-area { width:100%; border:1px solid var(--border); border-radius:10px; padding:12px; font-size:14px; font-family:inherit; resize:vertical; min-height:80px; outline:none; color:var(--text); }
    .comment-area:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .save-btn { width:100%; margin-top:14px; padding:13px; background:var(--text); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
    .save-btn:hover { opacity:.85; }

    /* Edit tab */
    .fgroup { margin-top:14px; }
    .flabel { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; }
    .finput { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; outline:none; color:var(--text); background:var(--card); }
    .finput:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    textarea.finput { resize:vertical; min-height:80px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .btn-primary { flex:1; padding:12px; background:var(--text); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
    .btn-primary:hover { opacity:.85; }
    .btn-danger { padding:12px 16px; background:var(--red-bg); color:var(--red); border:1px solid var(--red); border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
    .btn-danger:hover { background:var(--red); color:#fff; }

    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1f2937; color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; font-weight:500; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html">🎯 101 Cosas</a>

<header class="profile-header">
  <div class="profile-cover"></div>
  <div class="profile-inner">
    <div class="profile-row">
      <div class="profile-left">
        <div class="avatar-wrap">
          <img id="avatar-img" alt="Mario">
          <span class="avatar-initials" id="avatar-initials">M</span>
        </div>
        <div>
          <div class="profile-name">Mario Contreras Farías</div>
          <div class="profile-bio">Álbumes que voy a escuchar antes de morir 🎵</div>
          <div class="profile-social">
            <a href="https://www.instagram.com/macf81/" target="_blank" class="social-link"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://www.facebook.com/mariocontrerasfarias" target="_blank" class="social-link"><i class="fab fa-facebook"></i> Facebook</a>
          </div>
        </div>
      </div>
      <div class="stats-wrap">
        <div class="stats-row">
          <div class="stat"><div class="stat-num" id="s-total">—</div><div class="stat-lbl">Total</div></div>
          <div class="stat-div"></div>
          <div class="stat done"><div class="stat-num" id="s-done">—</div><div class="stat-lbl">Escuchados</div></div>
          <div class="stat-div"></div>
          <div class="stat"><div class="stat-num" id="s-pend">—</div><div class="stat-lbl">Pendientes</div></div>
        </div>

        <div class="progress-pct" id="prog-pct"></div>
      </div>
    </div>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search" class="search-box" placeholder="Buscar álbum o artista...">
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all">Todos</button>
    <button class="ftab" data-filter="done">Escuchados</button>
    <button class="ftab" data-filter="pend">Pendientes</button>
  </div>
  <select class="genre-select" id="genre-select">
    <option value="">Todos los géneros</option>
  </select>
  <button class="add-btn" id="add-btn"><i class="fas fa-plus"></i> Agregar</button>
</div>

<div class="albums-grid" id="grid"></div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-num" id="m-num">#1</span>
      <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-tabs">
      <button class="mtab active" data-tab="view">Ver</button>
      <button class="mtab" data-tab="edit">Editar</button>
    </div>

    <!-- VIEW TAB -->
    <div id="tab-view">
      <img class="modal-cover" id="m-cover" style="display:none" alt="">
      <div class="modal-cover-ph" id="m-cover-ph"><i class="fas fa-compact-disc"></i></div>
      <div class="modal-body">
        <div class="modal-genre" id="m-genre"></div>
        <div class="modal-title" id="m-title"></div>
        <div class="modal-meta" id="m-meta"></div>
        <div class="modal-desc" id="m-desc"></div>
        <div class="section-lbl" style="margin-top:0"><i class="fas fa-headphones"></i> ¿Ya lo escuchaste?</div>
        <div class="listen-toggle">
          <span class="toggle-label" id="toggle-lbl">No escuchado</span>
          <label class="toggle-wrap"><input type="checkbox" id="m-listened"><span class="toggle-track"></span></label>
        </div>
        <div class="section-lbl"><i class="fas fa-star"></i> Rating</div>
        <div class="stars-row" id="stars-row">
          <button class="star-btn" data-s="1">★</button>
          <button class="star-btn" data-s="2">★</button>
          <button class="star-btn" data-s="3">★</button>
          <button class="star-btn" data-s="4">★</button>
          <button class="star-btn" data-s="5">★</button>
        </div>
        <div class="section-lbl"><i class="fas fa-comment"></i> Mi comentario</div>
        <textarea class="comment-area" id="m-comment" placeholder="¿Qué te pareció? ¿Canciones favoritas?"></textarea>
        <button class="save-btn" id="save-btn"><i class="fas fa-save"></i> Guardar</button>
      </div>
    </div>

    <!-- EDIT TAB -->
    <div id="tab-edit" style="display:none">
      <div class="modal-body">
        <div class="fgroup">
          <label class="flabel">Título</label>
          <input type="text" id="e-title" class="finput" placeholder="Nombre del álbum">
        </div>
        <div class="fgroup">
          <label class="flabel">Artista</label>
          <input type="text" id="e-artist" class="finput" placeholder="ej: The Beatles">
        </div>
        <div class="fgroup">
          <label class="flabel">Año</label>
          <input type="text" id="e-year" class="finput" placeholder="ej: 1969">
        </div>
        <div class="fgroup">
          <label class="flabel">Género</label>
          <input type="text" id="e-genre" class="finput" placeholder="ej: LOS INAMOVIBLES">
        </div>
        <div class="fgroup">
          <label class="flabel">Descripción (opcional)</label>
          <textarea id="e-desc" class="finput" placeholder="¿Qué tiene de especial?"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-primary" id="edit-save-btn"><i class="fas fa-save"></i> Guardar</button>
          <button class="btn-danger" id="delete-btn"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ── STATE ─────────────────────────────────────────────────── */
let albums  = [];   // single source of truth: full album objects
let covers  = {};   // id → iTunes cover URL (cache)
let filter  = 'all';
let genre   = '';
let searchQ = '';
let openId  = null;
let curTab  = 'view';
let curRating = 0;

const observer = new IntersectionObserver(onVisible, { rootMargin:'200px' });

/* ── STORAGE ───────────────────────────────────────────────── */
function loadLocal() {
  try { albums = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e) { albums = null; }
  try { covers = JSON.parse(localStorage.getItem(COVER_KEY) || '{}'); } catch(e) { covers = {}; }
  // Fallback offline: seed en memoria pero NO guardar en localStorage (el Sheet siempre gana)
  if (!albums || !albums.length) {
    albums = SEED_ALBUMS.map(a => ({ ...a, listened:false, rating:0, comment:'' }));
    // No llamar saveLocal() aquí — así el Sheet siempre reemplaza al cargar
  }
}

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(albums)); } catch(e){}
}

function getAlbum(id) { return albums.find(a => a.id === id); }

function newId() {
  return albums.length ? Math.max(...albums.map(a => a.id)) + 1 : 1;
}

/* ── COVERS (iTunes API) ───────────────────────────────────── */
// Cola serializada para evitar 429 (Too Many Requests) de iTunes
const coverQueue = [];
let coverRunning = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function processCoverQueue() {
  if (coverRunning) return;
  coverRunning = true;
  while (coverQueue.length) {
    const { id, title, artist, resolve } = coverQueue.shift();
    if (covers[id]) { resolve(covers[id]); continue; }
    let url = '';
    // Last.fm: album.getInfo (CORS habilitado, base de datos excelente)
    try {
      const params = new URLSearchParams({
        method: 'album.getInfo',
        artist, album: title,
        api_key: LASTFM_KEY,
        format: 'json',
        autocorrect: '1'
      });
      const r = await fetch(`https://ws.audioscrobbler.com/2.0/?${params}`);
      if (r.ok) {
        const d = await r.json();
        if (d.album && d.album.image) {
          // Preferir tamaño "extralarge" o "large"
          const imgs = d.album.image;
          const xl  = imgs.find(i => i.size === 'extralarge');
          const lg  = imgs.find(i => i.size === 'large');
          url = (xl && xl['#text']) || (lg && lg['#text']) || '';
        }
      }
    } catch(e) {}
    if (url) {
      covers[id] = url;
      try { localStorage.setItem(COVER_KEY, JSON.stringify(covers)); } catch(e){}
    }
    resolve(url);
    if (coverQueue.length) await sleep(200); // 200ms entre requests
  }
  coverRunning = false;
}

function fetchCover(id, title, artist) {
  if (covers[id]) return Promise.resolve(covers[id]);
  return new Promise(resolve => {
    coverQueue.push({ id, title, artist, resolve });
    processCoverQueue();
  });
}

function onVisible(entries) {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const card = entry.target;
    const id   = +card.dataset.id;
    const alb  = getAlbum(id);
    if (!alb) return;
    observer.unobserve(card);
    fetchCover(id, alb.t, alb.a).then(url => { if (url) applyCoverToCard(card, url); });
  });
}

function applyCoverToCard(card, url) {
  const img = card.querySelector('.album-cover');
  const ph  = card.querySelector('.album-cover-ph');
  if (img) { img.src = url; img.style.display = 'block'; }
  if (ph)  { ph.style.display = 'none'; }
}

/* ── RENDER ────────────────────────────────────────────────── */
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function starsHtml(r, small) {
  const tag = small ? 'span' : 'button';
  return [1,2,3,4,5].map(i =>
    `<${tag} class="${small?'star-mini':'star-btn'}${i<=r?' on':''}"${small?'':` data-s="${i}"`}>★</${tag}>`
  ).join('');
}

function render() {
  const grid = document.getElementById('grid');
  const q    = searchQ.toLowerCase();
  const vis  = albums.filter(alb => {
    if (filter === 'done' && !alb.listened) return false;
    if (filter === 'pend' && alb.listened)  return false;
    if (genre  && alb.g !== genre)          return false;
    if (q && !alb.t.toLowerCase().includes(q) && !(alb.a||'').toLowerCase().includes(q)) return false;
    return true;
  });

  if (!vis.length) {
    grid.innerHTML = '<div class="empty"><i class="fas fa-search fa-2x"></i><p style="margin-top:10px">Sin resultados</p></div>';
    updateStats(); return;
  }

  grid.innerHTML = vis.map(alb => {
    const cov = covers[alb.id] || '';
    return `<div class="album-card${alb.listened?' is-done':''}" data-id="${alb.id}">
      <div class="album-cover-ph" style="${cov?'display:none':''}"><i class="fas fa-compact-disc"></i></div>
      <img class="album-cover" src="${esc(cov)}" style="${cov?'':'display:none'}" alt="">
      <div class="album-info">
        <div class="album-title">${esc(alb.t)}</div>
        <div class="album-artist">${esc(alb.a||'')}${alb.y?' · '+alb.y:''}</div>
        <div class="album-footer">
          <div class="stars-mini">${starsHtml(alb.rating||0, true)}</div>
          <span class="${alb.listened?'done-badge':'pend-badge'}">${alb.listened?'Escuchado':'Pendiente'}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.album-card').forEach(card => observer.observe(card));
  updateStats();
}

function updateStats() {
  const total = albums.length;
  const done  = albums.filter(a => a.listened).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent  = done;
  document.getElementById('s-pend').textContent  = total - done;
  document.getElementById('prog-fill').style.width = `${pct}%`;
  document.getElementById('prog-pct').textContent = `${pct}% escuchados`;
}

function buildGenreSelect() {
  const genres = [...new Set(albums.map(a => a.g).filter(Boolean))];
  const sel    = document.getElementById('genre-select');
  sel.length   = 1;
  genres.forEach(g => { const o = document.createElement('option'); o.value = o.textContent = g; sel.appendChild(o); });
}

/* ── MODAL ─────────────────────────────────────────────────── */
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.mtab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-view').style.display = tab === 'view' ? '' : 'none';
  document.getElementById('tab-edit').style.display = tab === 'edit' ? '' : 'none';
}

function openModal(id) {
  openId   = id;
  const alb = getAlbum(id);
  if (!alb) return;

  switchTab('view');

  // View tab
  document.getElementById('m-num').textContent    = `#${alb.id}`;
  document.getElementById('m-genre').textContent  = alb.g || '';
  document.getElementById('m-title').textContent  = alb.t;
  document.getElementById('m-meta').textContent   = `${alb.a||''}${alb.y?' · '+alb.y:''}`;
  document.getElementById('m-desc').textContent   = alb.d || '';
  document.getElementById('m-listened').checked   = !!alb.listened;
  document.getElementById('toggle-lbl').textContent = alb.listened ? '✅ Escuchado' : 'No escuchado';
  document.getElementById('m-comment').value      = alb.comment || '';
  setStarUI(alb.rating || 0);

  // Cover
  const cov = covers[id] || '';
  const img = document.getElementById('m-cover');
  const ph  = document.getElementById('m-cover-ph');
  if (cov) { img.src = cov; img.style.display = 'block'; ph.style.display = 'none'; }
  else {
    img.style.display = 'none'; ph.style.display = 'flex';
    fetchCover(id, alb.t, alb.a).then(url => {
      if (url) { img.src = url; img.style.display = 'block'; ph.style.display = 'none'; }
    });
  }

  // Edit tab
  document.getElementById('e-title').value  = alb.t || '';
  document.getElementById('e-artist').value = alb.a || '';
  document.getElementById('e-year').value   = String(alb.y || '');
  document.getElementById('e-genre').value  = alb.g || '';
  document.getElementById('e-desc').value   = alb.d || '';

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openAddModal() {
  openId = null;
  document.getElementById('m-num').textContent = 'Nuevo álbum';
  ['e-title','e-artist','e-year','e-genre','e-desc'].forEach(id => document.getElementById(id).value = '');
  switchTab('edit');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  openId = null;
}

function setStarUI(r) {
  curRating = r;
  document.querySelectorAll('#stars-row .star-btn').forEach(b => b.classList.toggle('on', +b.dataset.s <= r));
}

/* ── SYNC ──────────────────────────────────────────────────── */
function persist(alb, isDelete) {
  const ts = Date.now();
  saveLocal(); localStorage.setItem(LS_TS, ts);
  if (!APPS_SCRIPT_URL) return;
  if (isDelete) {
    const qs = new URLSearchParams({ action:'delete_item', type:LIST_TYPE, id:alb.id, ts });
    fetch(`${APPS_SCRIPT_URL}?${qs}`, { mode:'no-cors' }).catch(()=>{});
  } else {
    const qs = new URLSearchParams({ action:'save_item', type:LIST_TYPE, data:JSON.stringify(alb), ts });
    fetch(`${APPS_SCRIPT_URL}?${qs}`, { mode:'no-cors' }).catch(()=>{});
  }
}

async function loadFromAppsScript() {
  if (!APPS_SCRIPT_URL) return;
  try {
    const r    = await fetch(`${APPS_SCRIPT_URL}?type=${LIST_TYPE}`);
    const resp = await r.json();
    // El Sheet es siempre la fuente de verdad — sin comparación de timestamps
    if (Array.isArray(resp.items) && resp.items.length) {
      // Merge: sheet gana, pero conservar álbumes locales no presentes en el sheet (ej. agregados offline)
      const sheetMap = {};
      resp.items.forEach(item => { if (item.id) sheetMap[item.id] = item; });
      albums = albums.map(a => sheetMap[a.id] ? { ...a, ...sheetMap[a.id] } : a);
      resp.items.forEach(item => {
        if (item.id && item.t && !albums.find(a => a.id === item.id)) albums.push(item);
      });
      saveLocal();
      localStorage.setItem(LS_TS, resp.ts || Date.now());
      render(); updateStats();
    }
  } catch(e) {
    // Sin conexión: quedamos con lo que cargó loadLocal()
  }
}

/* ── TOAST ─────────────────────────────────────────────────── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── EVENTS ────────────────────────────────────────────────── */
document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.album-card');
  if (card) openModal(+card.dataset.id);
});

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('add-btn').addEventListener('click', openAddModal);

document.querySelectorAll('.mtab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

document.querySelectorAll('.ftab').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.filter;
  document.querySelectorAll('.ftab').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); render();
}));

document.getElementById('genre-select').addEventListener('change', e => { genre = e.target.value; render(); });
document.getElementById('search').addEventListener('input', e => { searchQ = e.target.value; render(); });

document.getElementById('m-listened').addEventListener('change', e => {
  document.getElementById('toggle-lbl').textContent = e.target.checked ? '✅ Escuchado' : 'No escuchado';
});

document.getElementById('stars-row').addEventListener('click', e => {
  const btn = e.target.closest('.star-btn');
  if (!btn) return;
  setStarUI(curRating === +btn.dataset.s ? 0 : +btn.dataset.s);
});

// Save listened/rating/comment
document.getElementById('save-btn').addEventListener('click', () => {
  if (!openId) return;
  const alb = getAlbum(openId);
  if (!alb) return;
  alb.listened = document.getElementById('m-listened').checked;
  alb.rating   = curRating;
  alb.comment  = document.getElementById('m-comment').value.trim();
  persist(alb); render(); closeModal();
  showToast(alb.listened ? '✅ Marcado como escuchado' : '💾 Guardado');
});

// Save album metadata (edit tab)
document.getElementById('edit-save-btn').addEventListener('click', () => {
  const title = document.getElementById('e-title').value.trim();
  if (!title) { alert('Ingresa el título'); return; }
  let isNew = false;
  if (openId) {
    const alb = getAlbum(openId);
    if (alb) {
      alb.t = title;
      alb.a = document.getElementById('e-artist').value.trim();
      alb.y = document.getElementById('e-year').value.trim();
      alb.g = document.getElementById('e-genre').value.trim();
      alb.d = document.getElementById('e-desc').value.trim();
      persist(alb);
    }
  } else {
    isNew = true;
    const alb = {
      id: newId(), t: title,
      a: document.getElementById('e-artist').value.trim(),
      y: document.getElementById('e-year').value.trim(),
      g: document.getElementById('e-genre').value.trim(),
      d: document.getElementById('e-desc').value.trim(),
      listened: false, rating: 0, comment: ''
    };
    albums.push(alb);
    persist(alb);
  }
  buildGenreSelect(); render(); closeModal();
  showToast(isNew ? '✅ Álbum agregado' : '✅ Actualizado');
});

// Delete album
document.getElementById('delete-btn').addEventListener('click', () => {
  if (!openId || !confirm('¿Eliminar este álbum de la lista?')) return;
  const alb = getAlbum(openId);
  albums = albums.filter(a => a.id !== openId);
  persist(alb, true);
  buildGenreSelect(); render(); closeModal();
  showToast('🗑️ Eliminado');
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── INIT ──────────────────────────────────────────────────── */
async function init() {
  loadLocal();
  buildGenreSelect();
  render();
  await loadFromAppsScript();
  buildGenreSelect();
  render();
}
init();

/* ── AVATAR ────────────────────────────────────────────────── */
function setAvatar(url) {
  const img = document.getElementById('avatar-img');
  const ini = document.getElementById('avatar-initials');
  if (url && img) { img.src = url; img.style.display = 'block'; if (ini) ini.style.display = 'none'; }
}
const _savedAvatar = localStorage.getItem('mcf_avatar');
if (_savedAvatar && !_savedAvatar.startsWith('data:')) setAvatar(_savedAvatar);
else setAvatar('https://unavatar.io/spotify/user:1237100585');
</script>
