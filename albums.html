<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbumes • Mario</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --blue:#3b82f6; --green:#22c55e; --orange:#f97316; --red:#ef4444; --purple:#a855f7;
      --green-bg:#f0fdf4; --orange-bg:#fff7ed; --blue-bg:#eff6ff;
      --text:#111827; --text2:#6b7280; --border:#e5e7eb;
      --card:#ffffff; --bg:#f9fafb;
      --gradient:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
      --shadow-sm:0 1px 3px rgba(0,0,0,.08); --shadow:0 4px 16px rgba(0,0,0,.10);
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }

    /* ── SITE NAV ───────────────────────────────────────── */
    .site-nav { background:var(--card); border-bottom:1px solid var(--border); display:flex; justify-content:center; overflow-x:auto; scrollbar-width:none; position:sticky; top:0; z-index:200; box-shadow:var(--shadow-sm); }
    .site-nav::-webkit-scrollbar { display:none; }
    .site-nav a { padding:10px 20px; text-decoration:none; color:var(--text2); font-size:13px; font-weight:600; border-bottom:2px solid transparent; white-space:nowrap; transition:all .15s; display:flex; align-items:center; gap:6px; }
    .site-nav a:hover { color:var(--text); background:var(--bg); }
    .site-nav a.active { color:var(--blue); border-bottom-color:var(--blue); }

    /* ── PAGE HEADER ────────────────────────────────────── */
    .page-header { background:var(--card); border-bottom:1px solid var(--border); }
    .header-cover { background:var(--gradient); height:18px; }
    .header-inner { max-width:980px; margin:0 auto; padding:16px 20px 14px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .header-title { font-size:22px; font-weight:800; display:flex; align-items:center; gap:10px; }
    .header-stats { display:flex; gap:24px; }
    .hstat { text-align:center; }
    .hstat-num { font-size:22px; font-weight:800; line-height:1; }
    .hstat-lbl { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
    .hstat.done .hstat-num { color:var(--green); }
    .hstat.pend .hstat-num { color:var(--orange); }
    .prog-bar { height:4px; background:var(--border); border-radius:2px; margin-top:10px; }
    .prog-fill { height:100%; background:var(--green); border-radius:2px; transition:width .4s; }
    .prog-pct { font-size:12px; color:var(--text2); margin-top:4px; }

    /* ── TOOLBAR ────────────────────────────────────────── */
    .toolbar { max-width:980px; margin:0 auto; padding:14px 20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .search-box { flex:1; min-width:200px; padding:8px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--card); outline:none; }
    .search-box:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .filter-tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .ftab { padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; color:var(--text2); }
    .ftab:hover { border-color:var(--blue); color:var(--blue); }
    .ftab.active { background:var(--text); color:#fff; border-color:var(--text); }
    .genre-select { padding:7px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--card); color:var(--text); cursor:pointer; }

    /* ── GRID ───────────────────────────────────────────── */
    .albums-grid { max-width:980px; margin:0 auto; padding:0 20px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:16px; }
    .album-card { background:var(--card); border-radius:12px; border:1px solid var(--border); overflow:hidden; cursor:pointer; transition:all .2s; box-shadow:var(--shadow-sm); }
    .album-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
    .album-card.is-done { border-color:rgba(34,197,94,.35); }
    .album-cover { width:100%; aspect-ratio:1; object-fit:cover; background:var(--border); display:block; }
    .album-cover-placeholder { width:100%; aspect-ratio:1; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.6); font-size:36px; }
    .album-info { padding:10px 12px 12px; }
    .album-title { font-size:13px; font-weight:700; line-height:1.3; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .album-artist { font-size:12px; color:var(--text2); margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .album-footer { display:flex; align-items:center; justify-content:space-between; }
    .stars-mini { display:flex; gap:1px; }
    .star-mini { font-size:11px; color:#d1d5db; }
    .star-mini.on { color:#f59e0b; }
    .done-badge { font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:var(--green-bg); color:var(--green); }
    .pend-badge { font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:var(--orange-bg); color:var(--orange); }
    .empty { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text2); }

    /* ── MODAL ──────────────────────────────────────────── */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; align-items:flex-end; justify-content:center; padding:0; }
    .overlay.open { display:flex; }
    @media(min-width:600px){ .overlay { align-items:center; padding:20px; } }
    .modal { background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; box-shadow:0 -4px 40px rgba(0,0,0,.2); display:flex; flex-direction:column; }
    @media(min-width:600px){ .modal { border-radius:20px; } }
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 0; }
    .modal-num { font-size:13px; font-weight:700; color:var(--text2); background:var(--bg); padding:3px 10px; border-radius:20px; }
    .modal-close { width:32px; height:32px; border:none; background:var(--bg); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:16px; }
    .modal-cover { width:100%; aspect-ratio:1; object-fit:cover; max-height:300px; }
    .modal-cover-placeholder { width:100%; aspect-ratio:1; max-height:300px; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.5); font-size:80px; }
    .modal-body { padding:18px 20px 24px; }
    .modal-title { font-size:22px; font-weight:800; line-height:1.3; margin-bottom:4px; }
    .modal-meta { font-size:14px; color:var(--text2); margin-bottom:14px; }
    .modal-genre { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--blue); background:var(--blue-bg); padding:3px 8px; border-radius:10px; margin-bottom:10px; }
    .modal-desc { font-size:14px; color:var(--text2); line-height:1.6; margin-bottom:16px; font-style:italic; }
    .section-lbl { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; display:flex; align-items:center; gap:5px; }

    .listen-toggle { display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:12px 16px; margin-bottom:14px; }
    .toggle-label { font-size:14px; font-weight:600; }
    .toggle-wrap { position:relative; display:inline-block; width:44px; height:24px; cursor:pointer; }
    .toggle-wrap input { opacity:0; width:0; height:0; }
    .toggle-track { position:absolute; inset:0; background:#d1d5db; border-radius:12px; transition:.3s; }
    .toggle-wrap input:checked + .toggle-track { background:var(--green); }
    .toggle-track::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.3s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .toggle-wrap input:checked + .toggle-track::after { left:22px; }

    .stars-row { display:flex; gap:6px; margin-bottom:14px; }
    .star-btn { font-size:28px; color:#d1d5db; cursor:pointer; transition:color .1s; background:none; border:none; padding:0; line-height:1; }
    .star-btn.on { color:#f59e0b; }
    .star-btn:hover { color:#f59e0b; }

    .comment-area { width:100%; border:1px solid var(--border); border-radius:10px; padding:12px; font-size:14px; font-family:inherit; resize:vertical; min-height:90px; outline:none; color:var(--text); }
    .comment-area:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .save-btn { width:100%; margin-top:14px; padding:13px; background:var(--text); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:opacity .15s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .save-btn:hover { opacity:.85; }

    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1f2937; color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; font-weight:500; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>

<!-- ── SITE NAV ──────────────────────────────────────────────── -->
<nav class="site-nav">
  <a href="index.html">🎯 101 Cosas</a>
  <a href="albums.html" class="active">🎵 Álbumes</a>
  <a href="movies.html">🎬 Películas</a>
  <a href="books.html">📚 Libros</a>
</nav>

<!-- ── PAGE HEADER ───────────────────────────────────────────── -->
<div class="page-header">
  <div class="header-cover"></div>
  <div class="header-inner">
    <div>
      <div class="header-title">🎵 Álbumes que escuchar antes de morir</div>
      <div class="prog-bar" style="max-width:300px"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-pct" id="prog-pct">0% escuchado</div>
    </div>
    <div class="header-stats">
      <div class="hstat"><div class="hstat-num" id="s-total">—</div><div class="hstat-lbl">Total</div></div>
      <div class="hstat done"><div class="hstat-num" id="s-done">—</div><div class="hstat-lbl">Escuchados</div></div>
      <div class="hstat pend"><div class="hstat-num" id="s-pend">—</div><div class="hstat-lbl">Pendientes</div></div>
    </div>
  </div>
</div>

<!-- ── TOOLBAR ───────────────────────────────────────────────── -->
<div class="toolbar">
  <input type="text" id="search" class="search-box" placeholder="Buscar álbum o artista...">
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all">Todos</button>
    <button class="ftab" data-filter="done">Escuchados</button>
    <button class="ftab" data-filter="pend">Pendientes</button>
  </div>
  <select class="genre-select" id="genre-select">
    <option value="">Todos los géneros</option>
  </select>
</div>

<!-- ── GRID ─────────────────────────────────────────────────── -->
<div class="albums-grid" id="grid"></div>

<!-- ── MODAL ────────────────────────────────────────────────── -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-num" id="m-num">#1</span>
      <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
    </div>
    <img class="modal-cover" id="m-cover" style="display:none">
    <div class="modal-cover-placeholder" id="m-cover-ph"><i class="fas fa-compact-disc"></i></div>
    <div class="modal-body">
      <div class="modal-genre" id="m-genre"></div>
      <div class="modal-title" id="m-title"></div>
      <div class="modal-meta" id="m-meta"></div>
      <div class="modal-desc" id="m-desc"></div>

      <div class="section-lbl"><i class="fas fa-headphones"></i> ¿Ya lo escuchaste?</div>
      <div class="listen-toggle">
        <span class="toggle-label" id="toggle-lbl">No escuchado</span>
        <label class="toggle-wrap"><input type="checkbox" id="m-listened"><span class="toggle-track"></span></label>
      </div>

      <div class="section-lbl"><i class="fas fa-star"></i> Rating</div>
      <div class="stars-row" id="stars-row">
        <button class="star-btn" data-s="1">★</button>
        <button class="star-btn" data-s="2">★</button>
        <button class="star-btn" data-s="3">★</button>
        <button class="star-btn" data-s="4">★</button>
        <button class="star-btn" data-s="5">★</button>
      </div>

      <div class="section-lbl"><i class="fas fa-comment"></i> Mi comentario</div>
      <textarea class="comment-area" id="m-comment" placeholder="¿Qué te pareció? ¿Canciones favoritas?"></textarea>

      <button class="save-btn" id="save-btn"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  {id:9,  t:'OK Computer',                                 a:'Radiohead',                 y:1997, g:'Los Inamovibles',         d:'La alienación del mundo digital antes de que existiera el mundo digital. Profética.'},

/* ── STATE ──────────────────────────────────────────────────── */
const LS_TS = 'mcf_albums_ts';
let userState = {}; // id → { listened, rating, comment }
let filter    = 'all';
let genre     = '';
let searchQ   = '';
let openId    = null;
let covers    = {};
const observer = new IntersectionObserver(onVisible, { rootMargin:'200px' });

function loadLocal() {
  try { userState = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { userState = {}; }
  try { covers    = JSON.parse(localStorage.getItem(COVER_KEY) || '{}'); } catch(e) { covers = {}; }
}

function stateOf(id) {
  return userState[id] || { listened:false, rating:0, comment:'' };
}

/* ── COVERS (iTunes API) ────────────────────────────────────── */
function onVisible(entries) {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const card = entry.target;
    const id   = +card.dataset.id;
    const alb  = ALBUMS.find(a => a.id === id);
    if (!alb) return;
    observer.unobserve(card);
    fetchCover(id, alb.t, alb.a).then(url => {
      if (!url) return;
      card.querySelectorAll('.cover-img').forEach(img => { img.src = url; img.style.display = 'block'; img.previousElementSibling && (img.previousElementSibling.style.display = 'none'); });
    });
  });
}

async function fetchCover(id, title, artist) {
  if (covers[id]) return covers[id];
  try {
    const q = encodeURIComponent(`${title} ${artist}`);
    const r = await fetch(`https://itunes.apple.com/search?term=${q}&entity=album&limit=1&media=music`);
    const d = await r.json();
    if (d.resultCount > 0) {
      const url = d.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
      covers[id] = url;
      try { localStorage.setItem(COVER_KEY, JSON.stringify(covers)); } catch(e){}
      return url;
    }
  } catch(e) {}
  return '';
}

/* ── RENDER ─────────────────────────────────────────────────── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function starsHtml(r, small) {
  const cls = small ? 'star-mini' : 'star-btn';
  return [1,2,3,4,5].map(i => `<${small?'span':'button'} class="${cls}${i<=r?' on':''}"${small?'':` data-s="${i}"`}>★</${small?'span':'button'}>`).join('');
}

function render() {
  const grid = document.getElementById('grid');
  const q    = searchQ.toLowerCase();
  let visible = ALBUMS.filter(alb => {
    if (genre && alb.g !== genre) return false;
    const st = stateOf(alb.id);
    if (filter === 'done' && !st.listened) return false;
    if (filter === 'pend' && st.listened)  return false;
    if (q && !alb.t.toLowerCase().includes(q) && !alb.a.toLowerCase().includes(q)) return false;
    return true;
  });

  if (!visible.length) { grid.innerHTML = '<div class="empty"><i class="fas fa-search fa-2x"></i><p style="margin-top:10px">Sin resultados</p></div>'; return; }

  grid.innerHTML = visible.map(alb => {
    const st  = stateOf(alb.id);
    const cov = covers[alb.id] || '';
    return `<div class="album-card${st.listened?' is-done':''}" data-id="${alb.id}">
      <div class="album-cover-placeholder" style="${cov?'display:none':''}""><i class="fas fa-compact-disc"></i></div>
      <img class="album-cover cover-img" src="${esc(cov)}" style="${cov?'':'display:none'}" alt="">
      <div class="album-info">
        <div class="album-title">${esc(alb.t)}</div>
        <div class="album-artist">${esc(alb.a)} · ${alb.y}</div>
        <div class="album-footer">
          <div class="stars-mini">${starsHtml(st.rating, true)}</div>
          <span class="${st.listened?'done-badge':'pend-badge'}">${st.listened?'Escuchado':'Pendiente'}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.album-card').forEach(card => observer.observe(card));
  updateStats();
}

function updateStats() {
  const total = ALBUMS.length;
  const done  = ALBUMS.filter(a => stateOf(a.id).listened).length;
  const pct   = total ? ((done/total)*100).toFixed(1) : 0;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent  = done;
  document.getElementById('s-pend').textContent  = total - done;
  document.getElementById('prog-fill').style.width = `${pct}%`;
  document.getElementById('prog-pct').textContent  = `${pct}% escuchado`;
}

/* ── GENRE SELECT ───────────────────────────────────────────── */
function buildGenreSelect() {
  const genres = [...new Set(ALBUMS.map(a => a.g))];
  const sel = document.getElementById('genre-select');
  genres.forEach(g => {
    const o = document.createElement('option');
    o.value = g; o.textContent = g;
    sel.appendChild(o);
  });
}

/* ── MODAL ──────────────────────────────────────────────────── */
function openModal(id) {
  openId = id;
  const alb = ALBUMS.find(a => a.id === id);
  const st  = stateOf(id);
  if (!alb) return;

  document.getElementById('m-num').textContent    = `#${alb.id}`;
  document.getElementById('m-genre').textContent  = alb.g;
  document.getElementById('m-title').textContent  = alb.t;
  document.getElementById('m-meta').textContent   = `${alb.a} · ${alb.y}`;
  document.getElementById('m-desc').textContent   = alb.d;
  document.getElementById('m-comment').value      = st.comment || '';
  document.getElementById('m-listened').checked   = !!st.listened;
  document.getElementById('toggle-lbl').textContent = st.listened ? '✅ Escuchado' : 'No escuchado';

  // Cover
  const cov = covers[id] || '';
  const img = document.getElementById('m-cover');
  const ph  = document.getElementById('m-cover-ph');
  if (cov) { img.src = cov; img.style.display = 'block'; ph.style.display = 'none'; }
  else {
    img.style.display = 'none'; ph.style.display = 'flex';
    fetchCover(id, alb.t, alb.a).then(url => { if (url) { img.src = url; img.style.display = 'block'; ph.style.display = 'none'; } });
  }

  // Stars
  setStarUI(st.rating || 0);

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  openId = null;
}

let currentRating = 0;
function setStarUI(r) {
  currentRating = r;
  document.querySelectorAll('#stars-row .star-btn').forEach(b => {
    b.classList.toggle('on', +b.dataset.s <= r);
  });
}

/* ── PERSIST ────────────────────────────────────────────────── */
function persist(id) {
  const ts = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(userState)); localStorage.setItem(LS_TS, ts); } catch(e){}
  if (!APPS_SCRIPT_URL) return;
  const data = { id, ...stateOf(id) };
  const qs   = new URLSearchParams({ action:'save_item', type:LIST_TYPE, data:JSON.stringify(data), ts });
  fetch(`${APPS_SCRIPT_URL}?${qs}`, { mode:'no-cors' }).catch(()=>{});
}

async function loadFromAppsScript() {
  if (!APPS_SCRIPT_URL) return;
  try {
    const r    = await fetch(`${APPS_SCRIPT_URL}?type=${LIST_TYPE}`);
    const resp = await r.json();
    const sheetTs = resp.ts || 0;
    const localTs = parseInt(localStorage.getItem(LS_TS) || '0');
    if (sheetTs > localTs && Array.isArray(resp.items) && resp.items.length) {
      resp.items.forEach(item => { if (item.id) userState[item.id] = item; });
      try { localStorage.setItem(LS_KEY, JSON.stringify(userState)); localStorage.setItem(LS_TS, sheetTs); } catch(e){}
    }
  } catch(e) {}
}

/* ── TOAST ──────────────────────────────────────────────────── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── EVENTS ─────────────────────────────────────────────────── */
document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.album-card');
  if (card) openModal(+card.dataset.id);
});

document.getElementById('overlay').addEventListener('click', e => { if (e.target === document.getElementById('overlay')) closeModal(); });
document.getElementById('modal-close').addEventListener('click', closeModal);

document.querySelectorAll('.ftab').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.filter;
  document.querySelectorAll('.ftab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  render();
}));

document.getElementById('genre-select').addEventListener('change', e => { genre = e.target.value; render(); });
document.getElementById('search').addEventListener('input', e => { searchQ = e.target.value; render(); });

document.getElementById('stars-row').addEventListener('click', e => {
  const btn = e.target.closest('.star-btn');
  if (!btn) return;
  const s = +btn.dataset.s;
  setStarUI(currentRating === s ? 0 : s);
});

document.getElementById('m-listened').addEventListener('change', e => {
  document.getElementById('toggle-lbl').textContent = e.target.checked ? '✅ Escuchado' : 'No escuchado';
});

document.getElementById('save-btn').addEventListener('click', () => {
  if (!openId) return;
  const listened = document.getElementById('m-listened').checked;
  const comment  = document.getElementById('m-comment').value.trim();
  userState[openId] = { id:openId, listened, rating:currentRating, comment };
  persist(openId);
  render();
  closeModal();
  showToast(listened ? '✅ Marcado como escuchado' : '💾 Guardado');
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── INIT ───────────────────────────────────────────────────── */
async function init() {
  loadLocal();
  buildGenreSelect();
  render();
  await loadFromAppsScript();
  render();
}

init();
</script>
</body>
</html>
